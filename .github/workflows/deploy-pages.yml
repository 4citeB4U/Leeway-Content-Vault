# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.CONTENT_VAULT.DEPLOYMENT
# TAG: LEEWAY.CONTENT_VAULT.DEPLOYMENT.PAGES
# WHAT: Build and deploy the standalone Content Vault UI to GitHub Pages.
# WHY: Serve a compiled Vite artifact at the canonical project-site prefix.
# WHO: LeeWay Content Vault engineering.
# WHERE: .github/workflows/deploy-pages.yml
# WHEN: 2026-11-04
# HOW: Node 22 install, lint, Vite build, upload dist, deploy via Pages.
# LICENSE: LeeWay owner-authored workflow.
name: Deploy LeeWay Content Vault
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build production site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
